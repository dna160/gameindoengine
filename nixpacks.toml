[phases.install]
cmds = [
  "npm install --prefix frontend",
  "npm install --prefix backend"
]

[phases.build]
cmds = [
  "npm run build --prefix frontend",
  "cp -r frontend/dist backend/public",
  "cd backend && npx prisma generate && npm run build"
]

# Run prisma from backend/ so it uses the pinned local CLI (v5) that matches
# @prisma/client — running `npx prisma` from the repo root downloads prisma@latest
# (v6) and crashes the query engine with a version mismatch.
[start]
cmd = "cd backend && npx prisma db push --accept-data-loss && node dist/server.js"
